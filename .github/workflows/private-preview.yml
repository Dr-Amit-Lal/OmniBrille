name: Release candidate artifact

on:
  workflow_dispatch:
    inputs:
      signing:
        description: Produce an unsigned validation artifact or require Authenticode signing
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - signed

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dng-free-skia:
    name: Build and prove DNG-free SkiaSharp x64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Check out OmniBrille build recipe
        uses: actions/checkout@v7

      - name: Install OmniBrille and upstream SkiaSharp SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.316
            10.0.105

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore official ABI reference
        shell: pwsh
        run: dotnet restore .\src\OmniBrille.Desktop\OmniBrille.Desktop.csproj --runtime win-x64

      - name: Install upstream-pinned LLVM
        shell: pwsh
        run: |
          $llvmHome = Join-Path $env:RUNNER_TEMP 'llvm-19.1.1'
          $llvmInstaller = Join-Path $env:RUNNER_TEMP 'LLVM-19.1.1-win64.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.1/LLVM-19.1.1-win64.exe' `
            -OutFile $llvmInstaller
          & 7z x $llvmInstaller -y "-o$llvmHome"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned LLVM extraction failed.' }
          & (Join-Path $llvmHome 'bin\clang.exe') --version
          "LLVM_HOME=$llvmHome" >> $env:GITHUB_ENV

      - name: Build and verify pinned DNG-free native asset
        shell: pwsh
        run: |
          $officialReference = Join-Path `
            $env:USERPROFILE `
            '.nuget\packages\skiasharp.nativeassets.win32\3.119.4\runtimes\win-x64\native\libSkiaSharp.dll'
          .\build\Build-DngFreeSkia.ps1 `
            -OfficialReferenceDll $officialReference `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts\dng-free-skia') `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 'omnibrille-dng-free-skia') `
            -LlvmHome $env:LLVM_HOME

      - name: Retain native asset and proof bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OmniBrille-dng-free-skia-3.119.4-${{ github.sha }}
          path: artifacts/dng-free-skia
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  validate-and-package:
    name: Windows release candidate (${{ inputs.signing }})
    needs: build-dng-free-skia
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AVALONIA_TELEMETRY_OPTOUT: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Import signing certificate
        if: inputs.signing == 'signed'
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.OMNIBRILLE_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.OMNIBRILLE_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'Signed release candidate requested, but signing secrets are unavailable.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'OmniBrille-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
              throw 'The signing certificate could not be imported with its private key.'
            }
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify and build unsigned release candidate
        if: inputs.signing == 'unsigned'
        shell: pwsh
        run: .\build\verify-release.ps1

      - name: Verify and build signed release candidate
        if: inputs.signing == 'signed'
        shell: pwsh
        env:
          OMNIBRILLE_SIGNING_CERTIFICATE_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: .\build\verify-release.ps1 -RequireSigning

      - name: Remove imported signing certificate
        if: always() && inputs.signing == 'signed' && steps.signing.outputs.thumbprint != ''
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: OmniBrille-release-candidate-${{ inputs.signing }}-${{ github.sha }}
          path: |
            artifacts/packages/OmniBrille-*-win-x64-setup.exe
            artifacts/packages/OmniBrille-*-win-x64-setup.exe.sha256
            artifacts/packages/OmniBrille-*-win-x64-setup-manifest.json
            artifacts/packages/OmniBrille-*-win-x64-setup-dependencies.json
            artifacts/packages/OmniBrille-*-win-x64-setup-release-notes.md
            build/Test-WindowsInstallerLifecycle.ps1
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  clean-install-gate:
    name: Fresh Windows installer lifecycle
    needs: validate-and-package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download exact candidate only
        uses: actions/download-artifact@v8
        with:
          name: OmniBrille-release-candidate-${{ inputs.signing }}-${{ github.sha }}
          path: candidate

      - name: Verify, install, launch, and uninstall exact candidate
        id: lifecycle
        shell: pwsh
        run: >-
          .\candidate\build\Test-WindowsInstallerLifecycle.ps1
          -ArtifactDirectory candidate
          -ExpectedCommit $env:GITHUB_SHA
          -ExpectedSigned ('${{ inputs.signing }}' -eq 'signed')

      - name: Retain exact candidate validation record
        uses: actions/upload-artifact@v7
        with:
          name: OmniBrille-release-validation-${{ github.sha }}
          path: candidate/OmniBrille-release-validation.json
          if-no-files-found: error
          retention-days: 90
